name: Tests

# Har bir PR (Dependabot'nikilari ham) va main'ga push: qotirilgan
# bog'liqliklar o'rnatiladimi, testlar o'tadimi, sayt yig'iladimi.
# Mos kelmaydigan versiyalar juftligi "pip install" bosqichida yiqiladi.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.14 — Render (servis shu versiyada), 3.12 — backend/Dockerfile.
        python: ["3.14", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests

  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Check that the bot compiles
        run: python -m py_compile bot.py storage.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # frontend/Dockerfile bilan bir xil.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
