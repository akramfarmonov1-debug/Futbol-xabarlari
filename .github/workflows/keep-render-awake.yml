name: Monitor backend and site

on:
  schedule:
    # Render Free 15 daqiqa traffiksiz qolsa uxlaydi. 10 daqiqalik ping
    # background pipeline va Telegram bot jarayonlarini faol saqlaydi.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Holat o'zgarmagan bo'lsa ham Telegram'ga yuborish (sozlamani sinash uchun)"
        type: boolean
        default: false

permissions:
  contents: read
  # Oldingi run natijasini o'qish uchun: ogohlantirish har safar emas, faqat
  # holat o'zgarganda (ishlayapti → yiqildi → tiklandi) yuboriladi.
  actions: read

concurrency:
  group: keep-render-backend-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    # monitor.sh eng yomon holatda ~4.5 daqiqa ishlaydi. Timeout undan qisqa
    # bo'lsa GitHub job'ni "cancelled" qiladi va sabab logga chiqmaydi.
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - name: Check backend and site
        id: check
        shell: bash
        run: bash .github/scripts/monitor.sh | tee "$RUNNER_TEMP/report.txt"

      - name: Alert on Telegram when the state changes
        if: always() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.check.outcome }}
          FORCE: ${{ inputs.test_alert == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$BOT_TOKEN" || -z "$CHAT_ID" ]]; then
            echo "::notice::ALERT_TELEGRAM_BOT_TOKEN / ALERT_TELEGRAM_CHAT_ID sozlanmagan — Telegram ogohlantirishi o'chiq."
            exit 0
          fi

          # Oxirgi yakunlangan tekshiruv; cancelled/skipped hisobga olinmaydi.
          workflow_file="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_file" \
            --status completed --limit 20 --json conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion // "unknown"')"

          if [[ "$FORCE" != "true" && "$OUTCOME" == "$previous" ]]; then
            echo "Holat o'zgarmadi ($OUTCOME) — xabar yuborilmaydi."
            exit 0
          fi

          if [[ "$OUTCOME" == "failure" ]]; then
            title="🔴 Futbol Xabar: nosozlik"
          else
            title="🟢 Futbol Xabar: hammasi ishlayapti"
          fi
          text="$(printf '%s\n\n%s\n\n%s' "$title" "$(cat "$RUNNER_TEMP/report.txt")" "$RUN_URL")"

          # Xato bo'lsa job'ni yiqitmaymiz: job natijasi faqat tekshiruvni
          # aks ettirsin, aks holda keyingi run "oldingi holat"ni noto'g'ri o'qiydi.
          response="$(curl -sS --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true")" || true
          if [[ "$response" != *'"ok":true'* ]]; then
            echo "::warning::Telegram xabari ketmadi: ${response:-javob kelmadi}"
            exit 0
          fi
          echo "Telegram'ga yuborildi: $title"
