services:
  - type: web
    name: futbol-xabar-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "vertex"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: "/etc/secrets/google-credentials.json"
      - key: GOOGLE_CLOUD_PROJECT
        value: "gen-lang-client-0604912271"
      - key: GOOGLE_CLOUD_LOCATION
        value: "global"
      - key: VERTEX_GEMINI_MODEL
        # Jonli servis 2026-08-15 holatiga shu modelda ishlayapti (/health).
        # Bu fayl "gemini-2.5-flash-lite" da qolib ketgan edi — blueprint
        # qayta qo'llanganda model jimgina pasayib ketardi.
        value: "gemini-3.7-flash"
      - key: ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: AUTO_PUBLISH
        value: "true"
      - key: AUTO_PUBLISH_MIN_IMPORTANCE
        value: "1"
      - key: AUTO_TELEGRAM
        value: "true"
      - key: AUTO_TELEGRAM_MIN_IMPORTANCE
        # Kalibrlangan shkalada 2 — quyi divizion natijalari va mish-mishlar;
        # kanalga 3 dan boshlab ketadi (transfer, murabbiy, top-liga).
        value: "3"
      - key: PIPELINE_INTERVAL
        value: "3600"
      - key: FRONTEND_ORIGIN
        value: "https://futbolxabar.uz"
      - key: DAILY_DIGEST
        value: "true"
      - key: DAILY_DIGEST_TIME
        value: "09:00"
      - key: DAILY_DIGEST_LIMIT
        value: "5"
      - key: DAILY_DIGEST_MIN_IMPORTANCE
        value: "3"
