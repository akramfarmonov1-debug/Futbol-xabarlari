services:
  - type: web
    name: futbol-xabar-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: futbol-xabar-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "vertex"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: "/etc/secrets/google-credentials.json"
      - key: GOOGLE_CLOUD_PROJECT
        value: "gen-lang-client-0604912271"
      - key: GOOGLE_CLOUD_LOCATION
        value: "global"
      - key: VERTEX_GEMINI_MODEL
        value: "gemini-2.5-flash-lite"
      - key: ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: AUTO_PUBLISH
        value: "true"
      - key: AUTO_TELEGRAM
        value: "true"
      - key: PIPELINE_INTERVAL
        value: "3600"
      - key: THESPORTSDB_API_KEY
        value: "123"
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "https://futbolxabar.uz"

databases:
  - name: futbol-xabar-db
    plan: free
